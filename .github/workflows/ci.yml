name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # A cap, because the failure mode this job actually had was not a red test —
    # it was Kotlin/Native sitting on a toolchain it did not have until the
    # six-hour default ran out. A job that hangs reads as a job that is working.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: packages-native/nomercy-video-player-kmp

      # Core is not on Maven Central yet, so the composite build is the only way
      # to resolve it. The relative path mirrors the monorepo, which is what
      # settings.gradle.kts looks for.
      - uses: actions/checkout@v4
        with:
          repository: NoMercy-Entertainment/nomercy-player-core-kmp
          path: packages-native/nomercy-player-core-kmp

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Without this every run downloads the Kotlin/Native distribution, the
      # Android SDK components and the whole dependency graph from cold.
      - uses: gradle/actions/setup-gradle@v4

      # The libass gate skips itself when the library is absent, which on a bare
      # runner means the whole desktop subtitle surface is untested while the
      # build stays green. Installing it is what turns that skip into a check.
      - name: Install libass
        run: sudo apt-get update && sudo apt-get install -y libass9

      - name: Build
        working-directory: packages-native/nomercy-video-player-kmp
        env:
          # Installing libass above only helps if a failure to use it is loud.
          # Without this the gate goes back to skipping when the package name
          # changes or the ABI moves, and the desktop rendering path is untested
          # behind a green tick — which is the state this job existed in until
          # someone checked.
          NOMERCY_REQUIRE_LIBASS: "1"
        run: ./gradlew build --stacktrace

  # The Apple half, which needs Xcode and therefore its own runner.
  #
  # It is not in the matrix above because it proves something different: that the
  # SwiftUI views build for both Apple platforms and that their bindings hold
  # when driven on a simulator. The Compose half is measured on Linux; this half
  # cannot be.
  apple:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          path: packages-native/nomercy-video-player-kmp

      - uses: actions/checkout@v4
        with:
          repository: NoMercy-Entertainment/nomercy-player-core-kmp
          path: packages-native/nomercy-player-core-kmp

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # The Swift package binds to the framework as a binary target, so the
      # framework has to exist before the package will even resolve.
      - name: Assemble the framework
        working-directory: packages-native/nomercy-video-player-kmp
        run: ./gradlew assembleNoMercyVideoPlayerXCFramework

      # The Apple public surface, on the only host that can compile it. The
      # Linux job cannot build these targets at all now that they bind to a C
      # library, so this is where the klib dump is actually verified.
      - name: Apple API check
        working-directory: packages-native/nomercy-video-player-kmp
        run: ./gradlew :subtitles-libass:klibApiCheck

      # The libass gate, on the only host that can run it. The Linux job
      # cannot: Apple targets need the Xcode toolchain, so a subtitle renderer
      # that only ever compiled would be the whole coverage of this surface.
      - name: Apple subtitle gate
        working-directory: packages-native/nomercy-video-player-kmp
        run: ./gradlew :subtitles-libass:iosSimulatorArm64Test

      - name: Apple views
        working-directory: packages-native/nomercy-video-player-kmp
        run: ./apple/NoMercyPlayer/check.sh
