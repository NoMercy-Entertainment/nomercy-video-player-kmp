name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: [self-hosted, Linux, X64, beast-unit]
    # A cap, because the failure mode this job actually had was not a red test —
    # it was Kotlin/Native sitting on a toolchain it did not have until the
    # six-hour default ran out. A job that hangs reads as a job that is working.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: packages-native/nomercy-video-player-kmp

      # Core is not on Maven Central yet, so the composite build is the only way
      # to resolve it. The relative path mirrors the monorepo, which is what
      # settings.gradle.kts looks for.
      - uses: actions/checkout@v4
        with:
          repository: NoMercy-Entertainment/nomercy-player-core-kmp
          path: packages-native/nomercy-player-core-kmp

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # The Android SDK, which a GitHub-hosted ubuntu image carried and a
      # self-hosted runner does not. Without it every Android target fails to
      # configure, and the message names a licence rather than a missing SDK.
      - uses: android-actions/setup-android@v3

      # Without this every run downloads the Kotlin/Native distribution, the
      # Android SDK components and the whole dependency graph from cold.
      - uses: gradle/actions/setup-gradle@v4

      # The libass gate skips itself when the library is absent, which on a bare
      # runner means the whole desktop subtitle surface is untested while the
      # build stays green. Installing it is what turns that skip into a check.
      - name: Install libass
        # Fonts as well as the library. libass rasterises GLYPHS, and a bare
        # runner has none — so the render gate asked for "Courier New", got
        # nothing, asked for a sans fallback, got nothing, and failed on the two
        # being identical. Liberation is metric-compatible with the Microsoft
        # families the fixtures name, which is what makes those two differ here
        # the way they differ on a real machine.
        #
        # fc-cache afterwards, and fc-match to prove it. Installing font
        # PACKAGES is not the same as fontconfig being able to find them: the
        # cue names "Skeleton Sans", which exists nowhere on purpose, so every
        # one of these gates depends on the fallback resolving. On a runner with
        # no cache built there is nothing to fall back to, libass lays the cue
        # out and rasterises no glyphs, and the failure reads as a broken
        # renderer rather than as a machine with no fonts.
        #
        # Installed only when missing, because this is a PERSISTENT machine
        # rather than a fresh VM: apt-get on every push is a package manager run
        # against a box other jobs are using, and a runner without passwordless
        # sudo would fail the build on a step that had nothing to do.
        run: |
          set -e
          if ! ldconfig -p | grep -q libass; then
            sudo apt-get update
            sudo apt-get install -y libass9 fontconfig fonts-liberation fonts-dejavu-core
            sudo fc-cache -f
          fi
          echo "sans     -> $(fc-match sans)"
          echo "skeleton -> $(fc-match 'Skeleton Sans')"

      # First, and on its own, because drift from the ecosystem contract is the
      # one failure whose cause is not in this repo's diff. Named, so a red run
      # says which question was answered no rather than burying it in a build
      # that takes ten minutes to reach the same conclusion.
      - name: Conformance gate
        working-directory: packages-native/nomercy-video-player-kmp
        run: ./gradlew parityConformance

      - name: Build
        working-directory: packages-native/nomercy-video-player-kmp
        env:
          # Installing libass above only helps if a failure to use it is loud.
          # Without this the gate goes back to skipping when the package name
          # changes or the ABI moves, and the desktop rendering path is untested
          # behind a green tick — which is the state this job existed in until
          # someone checked.
          NOMERCY_REQUIRE_LIBASS: "1"
        run: ./gradlew build --stacktrace

  # The Apple half, which needs Xcode and therefore its own runner.
  #
  # It is not in the matrix above because it proves something different: that the
  # SwiftUI views build for both Apple platforms and that their bindings hold
  # when driven on a simulator. The Compose half is measured on Linux; this half
  # cannot be.
  apple:
    runs-on: [self-hosted, macOS, ARM64, xcode]

    # Seventy-five, not forty-five.
    #
    # Forty-five was not a budget, it was a cliff this job had been walking
    # along: the last three runs that finished took 33, 38 and 41 minutes, and
    # then seven in a row hit the limit. GitHub reports a timeout as
    # `cancelled`, which reads exactly like a superseded run — so the failure
    # announced itself as the one thing nobody investigates.
    #
    # The cache below is the actual fix. This is the headroom that stops a slow
    # runner from reading as a broken commit while that takes effect.
    timeout-minutes: 75

    steps:
      - uses: actions/checkout@v4
        with:
          path: packages-native/nomercy-video-player-kmp

      - uses: actions/checkout@v4
        with:
          repository: NoMercy-Entertainment/nomercy-player-core-kmp
          path: packages-native/nomercy-player-core-kmp

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # This job builds core as a composite, and core assembles its macOS
      # libmpv payload out of the Homebrew keg. Without mpv here the payload
      # step fails with "no libmpv.dylib under /opt/homebrew/opt/mpv/lib",
      # which names a path rather than a missing dependency.
      - name: Install mpv
        run: brew list mpv >/dev/null 2>&1 || brew install mpv

      # The Kotlin/Native toolchain and its prebuilt platform libraries.
      #
      # setup-gradle caches the Gradle user home; ~/.konan is not in it, and it
      # is where the bulk of this job's time went. Every run downloaded the
      # native compiler and re-derived the platform klibs for iosArm64,
      # iosSimulatorArm64, iosX64 and both tvOS targets before compiling a line
      # of this project — the same work, from nothing, every time.
      #
      # Keyed on the version catalogue because that is what pins the Kotlin
      # version, and a stale toolchain for a bumped compiler is worse than no
      # cache: it links against libraries built by a different compiler and
      # fails somewhere unrelated.
      - name: Cache the Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('packages-native/nomercy-video-player-kmp/gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      # The Swift package binds to the framework as a binary target, so the
      # framework has to exist before the package will even resolve.
      - name: Assemble the framework
        working-directory: packages-native/nomercy-video-player-kmp
        run: ./gradlew assembleNoMercyVideoPlayerXCFramework

      # The stand-ins, which the test target binds to as a second binary target
      # and the shipped framework deliberately does not carry. Without this the
      # package will not resolve here at all: the path exists in a developer's
      # tree because they built it once, and CI starts from nothing every time.
      - name: Assemble the testing framework
        working-directory: packages-native/nomercy-player-core-kmp
        run: ./gradlew assembleNoMercyPlayerTestingXCFramework

      # The Apple public surface, on the only host that can compile it. The
      # Linux job cannot build these targets at all now that they bind to a C
      # library, so this is where the klib dump is actually verified.
      - name: Apple API check
        working-directory: packages-native/nomercy-video-player-kmp
        run: ./gradlew :subtitles-libass:klibApiCheck

      # The libass gate, on the only host that can run it. The Linux job
      # cannot: Apple targets need the Xcode toolchain, so a subtitle renderer
      # that only ever compiled would be the whole coverage of this surface.
      #
      # Both simulators, because tvOS is the one that cannot fall back on
      # anything. It ran on the iOS slice of the XCFramework until a tvOS link
      # was attempted for the first time and the linker refused the mix outright
      # — nothing had ever built for tvOS, so nothing had ever said so.
      - name: Apple subtitle gate
        working-directory: packages-native/nomercy-video-player-kmp
        run: ./gradlew :subtitles-libass:iosSimulatorArm64Test :subtitles-libass:tvosSimulatorArm64Test

      - name: Apple views
        working-directory: packages-native/nomercy-video-player-kmp
        run: ./apple/NoMercyPlayer/check.sh

  # The desktop renderer, on the desktops it claims to run on.
  #
  # The build job above covers Linux, and Linux was the whole of it — a library
  # that says it supports three desktops and is measured on one is making two of
  # those claims up. macOS resolves libass out of Homebrew and is the second
  # binding this code has ever been run through; Windows cannot load it at all,
  # because the only builds in circulation are statically linked inside VLC and
  # mpv, so there the gate skips and says which.
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          # mpv as well as libass. This job builds core as a composite, and
          # core assembles the macOS libmpv payload from the Homebrew keg — so
          # with only libass here it got past the Windows and Linux payloads it
          # correctly skips and died on its own with "no libmpv.dylib under
          # /opt/homebrew/opt/mpv/lib".
          - name: macos
            runner: [self-hosted, macOS, ARM64, xcode]
            install: brew install libass mpv
            require: "1"
          - name: windows
            runner: [self-hosted, Windows, X64]
            install: ""
            require: "0"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: packages-native/nomercy-video-player-kmp

      - uses: actions/checkout@v4
        with:
          repository: NoMercy-Entertainment/nomercy-player-core-kmp
          path: packages-native/nomercy-player-core-kmp

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # Only when missing, for the same reason the Linux job checks first: this
      # is a persistent machine, and `brew install` on every push is a package
      # manager run against a box other jobs are using.
      - name: Install libass
        if: matrix.install != ''
        run: brew list libass >/dev/null 2>&1 && brew list mpv >/dev/null 2>&1 || ${{ matrix.install }}

      - name: Desktop subtitle gate
        working-directory: packages-native/nomercy-video-player-kmp
        env:
          NOMERCY_REQUIRE_LIBASS: ${{ matrix.require }}
        run: ./gradlew :subtitles-libass:jvmTest --stacktrace
